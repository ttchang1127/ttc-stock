name: Deploy to GitHub Pages

# Replaces GitHub's built-in "pages build and deployment" workflow (classic
# "Deploy from a branch" mode), which started failing at every deploy attempt
# for this repo -- including after a full Settings -> Pages unpublish and
# republish, which ruled out a stuck deployment lock as the cause. That
# workflow is autogenerated and not readable via the API without repo-admin
# credentials, so its actual failure reason was never visible to us.
#
# This site has no framework and needs no Jekyll build (the classic workflow
# ran one anyway, unconditionally, for every project on "Deploy from a
# branch"), so this is also simpler: checkout, package the repo root, deploy.
#
# Requires Settings -> Pages -> Build and deployment -> Source = "GitHub
# Actions" (not "Deploy from a branch"). Until that's switched, this workflow
# will run but the deploy-pages step will fail, since the github-pages
# environment is still owned by the classic pipeline.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, queued rather than cancelled -- the classic pipeline's
# failures showed the exact pattern of a newer deployment cancelling an older
# one still in flight. Low commit frequency here (roughly one bot commit a
# day plus occasional manual pushes) means queuing costs nothing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4

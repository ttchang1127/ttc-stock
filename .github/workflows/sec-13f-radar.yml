name: SEC 13F stock radar

on:
  schedule:
    # 13F is quarterly and normally due 45 days after quarter end.  A monthly
    # check is enough; the script no-ops at the data level until SEC publishes
    # a new complete data set.
    - cron: '20 5 20 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sec-13f-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build complete stock-oriented 13F snapshot
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'SecKBResearch user@example.com' }}
        run: python3 scripts/sec_13f_stock_radar.py
      - name: Verify 13F output and dashboard contract
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/check_integrity.py --quiet
      - name: Persist new SEC data set
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add sec_13f_stock_radar.json 60_SEC_Filing_Radar/Form13F_Stock_Radar.md
          if git diff --cached --quiet; then
            echo "No 13F data-set change."
            exit 0
          fi
          git commit -m "chore: refresh complete SEC 13F stock radar"
          git pull --rebase origin main
          git push origin HEAD:main

name: Market rotation back-test

on:
  schedule:
    # Monthly: a C-quality back-test moves slowly and downloads about five
    # years of prices for ~500 securities. Early on the 3rd (UTC), after
    # month-end data has settled and outside the daily refresh window.
    - cron: '41 8 3 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-rotation-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python3 -m pip install --quiet -r requirements.txt
      - name: Re-run the research states over five years of prices
        run: python3 scripts/backtest_market_rotation.py
      - name: Test monthly medium-term momentum across the sector ETFs
        run: python3 scripts/backtest_sector_etf_momentum.py
      - name: Verify outputs
        run: |
          python3 -m unittest tests.test_backtest_market_rotation tests.test_market_rotation_research \
            tests.test_backtest_sector_etf_momentum -v
          python3 scripts/check_integrity.py --quiet
          python3 scripts/data_manifest.py check-changed --workflow market-rotation-backtest
      - name: Persist back-test results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add market_rotation_history/backtest/
          if git diff --cached --quiet; then
            echo "No back-test change."
            exit 0
          fi
          git commit -m "chore: refresh market rotation back-test (C quality)"
          git pull --rebase origin main
          git push origin HEAD:main

  # Separate job with its own checkout, so a failure anywhere in the jobs
  # above (even checkout or runner loss) is reported, and a later success
  # closes the issue again.
  alert:
    needs: [backtest]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Open or close the workflow failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: bash .github/scripts/workflow-alert.sh "$RESULTS"

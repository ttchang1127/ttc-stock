name: Refresh market and filing data

# The file is still called update-prices.yml on purpose: GitHub keys a
# workflow's schedule to its path, and renaming it would retire this cron and
# register a new one. The job outgrew the name; the schedule is worth more.

# The dashboard reads prices.json directly, so a price refresh alone kept that
# page current -- but every other figure on the site is derived and stored:
# market cap and Altman Z in fundamentals.json, the price and DCF in
# valuation.json, and the price, Sortino and DCF printed into all fourteen
# theses and report pages. This job used to commit prices.json and nothing
# else, so those sat at whatever a human last computed. On 2026-08-04 and
# 08-05 the bot pushed new prices and the reports kept showing older ones.
#
# It also never fetched SEC financials at all, so a newly filed 10-K only
# arrived when someone ran the pipeline by hand.
#
# Both fetchers leave their file untouched when nothing moved, so the gate
# below is what stops this committing every weekday regardless.

on:
  schedule:
    # 23:00 UTC every day keeps the rolling 30-day company calendar moving on
    # weekends too. Market/SEC derived files are recomputed only when their
    # underlying source files actually change.
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet 'yfinance>=1.2.0' pandas 'pypdf>=6,<7'

      # Read-only early warning. A new annual filing still requires a person to
      # run fetch_sec.py --split-sections and review the extracted boundaries.
      - name: Check for new 10-K or 20-F
        run: python3 scripts/check_new_annual_filings.py

      - name: Fetch daily closes
        run: python3 scripts/fetch_price_history.py

      # Refuses to write on a partial fetch, so a transient SEC error cannot
      # delete a filer's history and take every derived file with it.
      - name: Fetch SEC financials
        run: python3 scripts/fetch_xbrl_financials.py

      # Builds true single-quarter trends. Q4 flows come from 10-K FY minus
      # the matching 9M 10-Q; non-additive EPS/share figures stay blank.
      - name: Fetch SEC quarterly trends
        run: python3 scripts/fetch_quarterly_financials.py

      - name: Check whether market or filing source data moved
        id: source_gate
        run: |
          if git diff --quiet -- prices.json financials.json quarterly_financials.json; then
            echo "No new quotes or filings; derived market files stay unchanged."
            echo "market_changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat -- prices.json financials.json quarterly_financials.json
            echo "market_changed=true" >> "$GITHUB_OUTPUT"
          fi

      # dcf_assumptions.json is deliberately absent from this chain. Its growth
      # and WACC values are derived, but deciding to re-derive them is a
      # judgement, so estimate_dcf_inputs.py is never run here.
      - name: Recompute everything derived
        if: steps.source_gate.outputs.market_changed == 'true'
        run: |
          python3 scripts/compute_fundamentals.py
          python3 scripts/compute_financial_health.py
          python3 scripts/compute_valuation.py
          python3 scripts/update_thesis_financials.py
          python3 scripts/build_reports.py

      - name: Refresh daily AI-review change candidates
        if: steps.source_gate.outputs.market_changed == 'true'
        run: |
          python3 scripts/build_sec_candidate_rule_calibration.py
          python3 scripts/generate_sec_daily_change_candidates.py

      - name: Compare portfolio impact with the previous snapshot
        if: steps.source_gate.outputs.market_changed == 'true'
        id: position_impact
        run: |
          python3 scripts/build_sec_position_impact_history.py \
            --alert-markdown "$RUNNER_TEMP/position-impact-alert.md" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Refresh rolling 30-day stock event calendar
        run: python3 scripts/build_company_event_calendar.py

      - name: Detect and safely roll new segment periods
        id: segment_sync
        # Publishes segment_driver_update_candidates.json and
        # Segment_Driver_Update_Candidates.md; unsafe boundaries stay pending.
        run: |
          python3 scripts/sync_segment_driver_history.py \
            --alert-markdown "$RUNNER_TEMP/segment-alert.md" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build segment operating, history, and growth-driver validation
        id: segment_driver
        # Publishes Segment_Driver_Validation.md and Segment_Driver_History.md.
        run: |
          python3 scripts/build_segment_driver_validation.py
          python3 scripts/build_segment_driver_history.py \
            --alert-markdown "$RUNNER_TEMP/segment-alert.md" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"
          python3 scripts/build_segment_thesis_linkage.py
          python3 scripts/build_segment_outlook_verification.py

      - name: Build pre/post earnings verification cards
        run: python3 scripts/build_earnings_verification_cards.py

      - name: Track earnings verification history and differences
        id: earnings_verification
        run: |
          python3 scripts/track_earnings_verification_history.py \
            --checked-at "$(TZ=Asia/Taipei date -Iseconds)" \
            --alert-markdown "$RUNNER_TEMP/earnings-verification-alert.md" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Stop unless any publishable data moved
        id: gate
        run: |
          if git diff --quiet; then
            echo "No source, derived, or event-calendar changes to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The checks that caught TSMC's $29bn net-cash error, NVIDIA's stale
      # ROIC-WACC and TSMC's $10.9tn market cap. They existed only as snippets
      # in the SOP, so nothing ran them and all three shipped. Running them here
      # means data that fails is never pushed.
      - name: Verify data integrity
        if: steps.gate.outputs.changed == 'true'
        run: python3 scripts/check_integrity.py

      - name: Fail if anything unexpected changed
        if: steps.gate.outputs.changed == 'true'
        run: |
          unexpected=$(git status --porcelain | awk '{print $2}' | grep -Ev \
            '^(prices|financials|quarterly_financials|fundamentals|financial_health|valuation|sec_daily_change_candidates|sec_candidate_rule_calibration|sec_position_impact_history|company_event_calendar|earnings_verification_cards|earnings_verification_history|segment_driver_validation|segment_driver_history|segment_driver_history_inputs|segment_driver_update_candidates|segment_thesis_linkage|segment_outlook_verification)\.json$|^[a-z]+_report\.html$|^30_Analysis/.*_Master_Investment_Thesis_2026\.md$|^60_SEC_Filing_Radar/(SEC_(Daily_Change_Candidates|Candidate_Rule_Calibration|Position_Impact_History)|Company_Event_Calendar|Earnings_Verification_(Cards|History)|Segment_Driver_(Validation|History|Update_Candidates)|Segment_Thesis_Linkage|Segment_Outlook_Verification)\.md$' \
            || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed; refusing to commit:"
            echo "$unexpected"
            exit 1
          fi

      - name: Notify meaningful portfolio-impact changes
        if: steps.source_gate.outputs.market_changed == 'true' && steps.position_impact.outputs.notify_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          POSITION_IMPACT_BATCH_ID: ${{ steps.position_impact.outputs.batch_id }}
          POSITION_IMPACT_CRITICAL_COUNT: ${{ steps.position_impact.outputs.critical_count }}
        run: |
          title="Portfolio Impact Alert [$POSITION_IMPACT_BATCH_ID]"
          if [ "$POSITION_IMPACT_CRITICAL_COUNT" != "0" ]; then
            title="🔴 $title"
          else
            title="🟠 $title"
          fi
          existing=$(gh issue list --state all --search "$POSITION_IMPACT_BATCH_ID in:title" \
            --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/position-impact-alert.md" \
              --assignee "$GITHUB_REPOSITORY_OWNER"
          else
            echo "Issue #$existing already records batch $POSITION_IMPACT_BATCH_ID; skipping duplicate."
          fi

      - name: Notify meaningful earnings-verification changes
        if: steps.earnings_verification.outputs.notify_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          EARNINGS_VERIFICATION_BATCH_ID: ${{ steps.earnings_verification.outputs.batch_id }}
          EARNINGS_VERIFICATION_CRITICAL_COUNT: ${{ steps.earnings_verification.outputs.critical_count }}
        run: |
          title="Earnings Verification Alert [$EARNINGS_VERIFICATION_BATCH_ID]"
          if [ "$EARNINGS_VERIFICATION_CRITICAL_COUNT" != "0" ]; then
            title="🔴 $title"
          else
            title="🟠 $title"
          fi
          existing=$(gh issue list --state all --search "$EARNINGS_VERIFICATION_BATCH_ID in:title" \
            --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/earnings-verification-alert.md" \
              --assignee "$GITHUB_REPOSITORY_OWNER"
          else
            echo "Issue #$existing already records batch $EARNINGS_VERIFICATION_BATCH_ID; skipping duplicate."
          fi

      - name: Notify segment update candidates or transitions
        if: steps.segment_sync.outputs.notify_count != '0' || steps.segment_driver.outputs.notify_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SEGMENT_SYNC_BATCH_ID: ${{ steps.segment_sync.outputs.batch_id }}
          SEGMENT_SYNC_CRITICAL_COUNT: ${{ steps.segment_sync.outputs.critical_count }}
          SEGMENT_DRIVER_BATCH_ID: ${{ steps.segment_driver.outputs.batch_id }}
          SEGMENT_DRIVER_CRITICAL_COUNT: ${{ steps.segment_driver.outputs.critical_count }}
        run: |
          batch_id="$SEGMENT_SYNC_BATCH_ID-$SEGMENT_DRIVER_BATCH_ID"
          critical_count=$((SEGMENT_SYNC_CRITICAL_COUNT + SEGMENT_DRIVER_CRITICAL_COUNT))
          title="Segment Update Alert [$batch_id]"
          if [ "$critical_count" != "0" ]; then
            title="🔴 $title"
          else
            title="🟠 $title"
          fi
          existing=$(gh issue list --state all --search "$batch_id in:title" \
            --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/segment-alert.md" \
              --assignee "$GITHUB_REPOSITORY_OWNER"
          else
            echo "Issue #$existing already records batch $batch_id; skipping duplicate."
          fi

      - name: Commit
        if: steps.gate.outputs.changed == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: refresh market and filing data ($(date -u +%Y-%m-%d))"
          git push

name: Refresh market and filing data

# The file is still called update-prices.yml on purpose: GitHub keys a
# workflow's schedule to its path, and renaming it would retire this cron and
# register a new one. The job outgrew the name; the schedule is worth more.

# The dashboard reads prices.json directly, so a price refresh alone kept that
# page current -- but every other figure on the site is derived and stored:
# market cap and Altman Z in fundamentals.json, the price and DCF in
# valuation.json, and the price, Sortino and DCF printed into all fourteen
# theses and report pages. This job used to commit prices.json and nothing
# else, so those sat at whatever a human last computed. On 2026-08-04 and
# 08-05 the bot pushed new prices and the reports kept showing older ones.
#
# It also never fetched SEC financials at all, so a newly filed 10-K only
# arrived when someone ran the pipeline by hand.
#
# Both fetchers leave their file untouched when nothing moved, so the gate
# below is what stops this committing every weekday regardless.

on:
  schedule:
    # 23:17 UTC every day keeps the rolling 30-day company calendar moving on
    # weekends too. The non-zero minute also avoids GitHub's busiest cron slot.
    - cron: '17 23 * * *'
    # Yahoo occasionally publishes adjusted US-equity closes hours after the
    # first run. This Tue-Sat catch-up (20:17 Taipei) makes that recovery fully
    # automatic. Unchanged fetches do not produce a commit.
    - cron: '17 12 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python3 -m pip install --quiet -r requirements.txt

      # A successful HTTP response is not enough: on 2026-09-15 Yahoo returned
      # hundreds of valid histories whose latest adjusted close was still
      # 2026-09-11. Probe one liquid market proxy before the expensive broad
      # download. A stale source is retried, then market work is deferred while
      # independent SEC/event jobs continue below.
      - name: Wait for latest adjusted market close
        id: market_source
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Market-source readiness attempt $attempt/3"
            set +e
            python3 scripts/check_market_source_ready.py \
              --github-output "$GITHUB_OUTPUT"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -ne 75 ]; then
              echo "::error::Market-source probe failed unexpectedly with exit code $status."
              exit "$status"
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Adjusted close is stale; retrying in 5 minutes."
              sleep 300
            fi
          done
          echo "fresh=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Market source remains stale; preserving prior market files and continuing non-market refreshes."

      # Read-only early warning. A new annual filing still requires a person to
      # run fetch_sec.py --split-sections and review the extracted boundaries.
      - name: Check for new 10-K or 20-F
        run: python3 scripts/check_new_annual_filings.py

      - name: Fetch daily closes
        if: steps.market_source.outputs.fresh == 'true'
        run: python3 scripts/fetch_price_history.py

      # Kept separate from prices.json: the standalone rotation page needs
      # roughly 500 securities, while the portfolio dashboard needs only its
      # small tracked list. The builder publishes aggregates, not raw histories.
      - name: Build S&P 500 and Nasdaq-100 market rotation
        if: steps.market_source.outputs.fresh == 'true'
        id: rotation_build
        shell: bash
        run: |
          set +e
          # --write-history appends this session's frozen research snapshot
          # (market_rotation_history/) in the same atomic batch as the page files.
          python3 scripts/build_market_rotation.py --write-history
          status=$?
          set -e
          if [ "$status" -eq 75 ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Broad-market latest-session coverage is incomplete; preserving the prior rotation file."
            exit 0
          fi
          if [ "$status" -eq 0 ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      # Compares today's frozen snapshot with the previous sessions and joins
      # the rotation states to the actual direct-equity holdings.
      - name: Build rotation digest and portfolio exposure
        if: steps.rotation_build.outputs.fresh == 'true'
        id: rotation_digest
        run: |
          python3 scripts/build_market_rotation_digest.py \
            --github-output "$GITHUB_OUTPUT" \
            --alert-markdown "$RUNNER_TEMP/rotation-digest.md"

      # Research only: constituent breadth and concentration of the frozen
      # theme-ETF list, from the N-PORT holdings the SEC workflow commits.
      # Exit 75 (no usable SPY close) keeps the previous file; any other
      # failure is reported but never blocks the rest of the refresh.
      - name: Build theme ETF constituent health
        if: steps.rotation_build.outputs.fresh == 'true'
        shell: bash
        run: |
          set +e
          python3 scripts/build_etf_health.py
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::Theme ETF health not rebuilt (exit $status); the previous etf_health.json is kept."
            git checkout -- etf_health.json 2>/dev/null || true
          fi

      - name: Notify if the automatic catch-up is still stale
        if: >-
          github.event.schedule == '17 12 * * 2-6' &&
          (steps.market_source.outputs.fresh != 'true' || steps.rotation_build.outputs.fresh == 'false')
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SESSION: ${{ steps.market_source.outputs.expected_session }}
          LATEST_SESSION: ${{ steps.market_source.outputs.latest_session }}
          ROTATION_FRESH: ${{ steps.rotation_build.outputs.fresh }}
        run: |
          title="Market Data Stale [$EXPECTED_SESSION]"
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "🟠 $title" --body "Market data is still stale or broad-market coverage is incomplete after the evening catch-up. Expected session: $EXPECTED_SESSION. SPY latest session: $LATEST_SESSION. Rotation fresh: $ROTATION_FRESH. Prior market files were preserved; SEC and event refreshes continued."
          else
            echo "Issue #$existing already records stale session $EXPECTED_SESSION."
          fi

      # Refuses to write on a partial fetch, so a transient SEC error cannot
      # delete a filer's history and take every derived file with it.
      - name: Fetch SEC financials
        run: python3 scripts/fetch_xbrl_financials.py

      # Builds true single-quarter trends. Q4 flows come from 10-K FY minus
      # the matching 9M 10-Q; non-additive EPS/share figures stay blank.
      - name: Fetch SEC quarterly trends
        run: python3 scripts/fetch_quarterly_financials.py

      - name: Check whether market or filing source data moved
        id: source_gate
        run: |
          if git diff --quiet -- prices.json financials.json quarterly_financials.json; then
            echo "No new quotes or filings; derived market files stay unchanged."
            echo "market_changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat -- prices.json financials.json quarterly_financials.json
            echo "market_changed=true" >> "$GITHUB_OUTPUT"
          fi

      # dcf_assumptions.json is deliberately absent from this chain. Its growth
      # and WACC values are derived, but deciding to re-derive them is a
      # judgement, so estimate_dcf_inputs.py is never run here.
      - name: Recompute everything derived
        if: steps.source_gate.outputs.market_changed == 'true'
        run: |
          python3 scripts/compute_fundamentals.py
          python3 scripts/compute_financial_health.py
          python3 scripts/compute_valuation.py
          python3 scripts/update_thesis_financials.py
          python3 scripts/build_reports.py

      - name: Refresh daily AI-review change candidates
        if: steps.source_gate.outputs.market_changed == 'true'
        run: |
          python3 scripts/build_sec_candidate_rule_calibration.py
          python3 scripts/generate_sec_daily_change_candidates.py

      - name: Pre-screen refreshed candidates with TypeSafe Jev
        if: steps.source_gate.outputs.market_changed == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TYPESAFE_DEFAULT_MODEL: jev-1.13.0
        run: python3 scripts/review_sec_candidates_with_jev.py

      - name: Compare portfolio impact with the previous snapshot
        if: steps.source_gate.outputs.market_changed == 'true'
        id: position_impact
        run: |
          python3 scripts/build_sec_position_impact_history.py \
            --alert-markdown "$RUNNER_TEMP/position-impact-alert.md" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Refresh rolling 30-day stock event calendar
        run: python3 scripts/build_company_event_calendar.py

      - name: Detect and safely roll new segment periods
        id: segment_sync
        # Publishes segment_driver_update_candidates.json and
        # Segment_Driver_Update_Candidates.md; unsafe boundaries stay pending.
        run: |
          python3 scripts/sync_segment_driver_history.py \
            --alert-markdown "$RUNNER_TEMP/segment-alert.md" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build segment operating, history, and growth-driver validation
        id: segment_driver
        # Publishes Segment_Driver_Validation.md and Segment_Driver_History.md.
        run: |
          python3 scripts/build_segment_driver_validation.py
          python3 scripts/build_segment_driver_history.py \
            --alert-markdown "$RUNNER_TEMP/segment-alert.md" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"
          python3 scripts/build_segment_thesis_linkage.py
          python3 scripts/build_segment_outlook_verification.py

      - name: Track segment outlook revisions and outcomes
        id: segment_outlook
        run: |
          python3 scripts/track_segment_outlook_history.py \
            --checked-at "$(TZ=Asia/Taipei date -Iseconds)" \
            --alert-markdown "$RUNNER_TEMP/segment-alert.md" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build and track capital allocation cards
        id: capital_allocation
        run: |
          python3 scripts/build_capital_allocation_cards.py
          python3 scripts/track_capital_allocation_history.py \
            --checked-at "$(TZ=Asia/Taipei date -Iseconds)" \
            --alert-markdown "$RUNNER_TEMP/capital-allocation-alert.md" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build seven-dimension long-term investment radar
        run: python3 scripts/build_long_term_radar.py

      - name: Build pre/post earnings verification cards
        run: python3 scripts/build_earnings_verification_cards.py

      - name: Track earnings verification history and differences
        id: earnings_verification
        run: |
          python3 scripts/track_earnings_verification_history.py \
            --checked-at "$(TZ=Asia/Taipei date -Iseconds)" \
            --alert-markdown "$RUNNER_TEMP/earnings-verification-alert.md" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build evidence-led research synthesis
        # Publishes research_synthesis.json and the matching Obsidian note.
        run: python3 scripts/build_research_synthesis.py

      - name: Stop unless any publishable data moved
        id: gate
        run: |
          if git diff --quiet; then
            echo "No source, derived, or event-calendar changes to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The checks that caught TSMC's $29bn net-cash error, NVIDIA's stale
      # ROIC-WACC and TSMC's $10.9tn market cap. They existed only as snippets
      # in the SOP, so nothing ran them and all three shipped. Running them here
      # means data that fails is never pushed.
      - name: Verify data integrity
        if: steps.gate.outputs.changed == 'true'
        run: python3 scripts/check_integrity.py

      # data_manifest.json lists which files this workflow may commit, so
      # a new generated file is added there instead of to an inline regex.
      - name: Fail if anything unexpected changed
        if: steps.gate.outputs.changed == 'true'
        run: python3 scripts/data_manifest.py check-changed --workflow update-prices

      - name: Notify confirmed market-rotation changes
        if: steps.rotation_digest.outputs.notify_count != '' && steps.rotation_digest.outputs.notify_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ROTATION_BATCH_ID: ${{ steps.rotation_digest.outputs.batch_id }}
        run: |
          title="Market Rotation Changes [$ROTATION_BATCH_ID]"
          existing=$(gh issue list --state all --search "$ROTATION_BATCH_ID in:title" \
            --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "📈 $title" --body-file "$RUNNER_TEMP/rotation-digest.md" \
              --assignee "$GITHUB_REPOSITORY_OWNER"
          else
            echo "Issue #$existing already records batch $ROTATION_BATCH_ID; skipping duplicate."
          fi

      - name: Notify meaningful portfolio-impact changes
        if: steps.source_gate.outputs.market_changed == 'true' && steps.position_impact.outputs.notify_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          POSITION_IMPACT_BATCH_ID: ${{ steps.position_impact.outputs.batch_id }}
          POSITION_IMPACT_CRITICAL_COUNT: ${{ steps.position_impact.outputs.critical_count }}
        run: |
          title="Portfolio Impact Alert [$POSITION_IMPACT_BATCH_ID]"
          if [ "$POSITION_IMPACT_CRITICAL_COUNT" != "0" ]; then
            title="🔴 $title"
          else
            title="🟠 $title"
          fi
          existing=$(gh issue list --state all --search "$POSITION_IMPACT_BATCH_ID in:title" \
            --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/position-impact-alert.md" \
              --assignee "$GITHUB_REPOSITORY_OWNER"
          else
            echo "Issue #$existing already records batch $POSITION_IMPACT_BATCH_ID; skipping duplicate."
          fi

      - name: Notify meaningful earnings-verification changes
        if: steps.earnings_verification.outputs.notify_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          EARNINGS_VERIFICATION_BATCH_ID: ${{ steps.earnings_verification.outputs.batch_id }}
          EARNINGS_VERIFICATION_CRITICAL_COUNT: ${{ steps.earnings_verification.outputs.critical_count }}
        run: |
          title="Earnings Verification Alert [$EARNINGS_VERIFICATION_BATCH_ID]"
          if [ "$EARNINGS_VERIFICATION_CRITICAL_COUNT" != "0" ]; then
            title="🔴 $title"
          else
            title="🟠 $title"
          fi
          existing=$(gh issue list --state all --search "$EARNINGS_VERIFICATION_BATCH_ID in:title" \
            --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/earnings-verification-alert.md" \
              --assignee "$GITHUB_REPOSITORY_OWNER"
          else
            echo "Issue #$existing already records batch $EARNINGS_VERIFICATION_BATCH_ID; skipping duplicate."
          fi

      - name: Notify meaningful capital-allocation changes
        if: steps.capital_allocation.outputs.notify_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CAPITAL_ALLOCATION_BATCH_ID: ${{ steps.capital_allocation.outputs.batch_id }}
          CAPITAL_ALLOCATION_CRITICAL_COUNT: ${{ steps.capital_allocation.outputs.critical_count }}
        run: |
          title="Capital Allocation Alert [$CAPITAL_ALLOCATION_BATCH_ID]"
          if [ "$CAPITAL_ALLOCATION_CRITICAL_COUNT" != "0" ]; then
            title="🔴 $title"
          else
            title="🟠 $title"
          fi
          existing=$(gh issue list --state all --search "$CAPITAL_ALLOCATION_BATCH_ID in:title" \
            --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/capital-allocation-alert.md" \
              --assignee "$GITHUB_REPOSITORY_OWNER"
          else
            echo "Issue #$existing already records batch $CAPITAL_ALLOCATION_BATCH_ID; skipping duplicate."
          fi

      - name: Notify segment update candidates, transitions, or outlook changes
        if: steps.segment_sync.outputs.notify_count != '0' || steps.segment_driver.outputs.notify_count != '0' || steps.segment_outlook.outputs.notify_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SEGMENT_SYNC_BATCH_ID: ${{ steps.segment_sync.outputs.batch_id }}
          SEGMENT_SYNC_CRITICAL_COUNT: ${{ steps.segment_sync.outputs.critical_count }}
          SEGMENT_DRIVER_BATCH_ID: ${{ steps.segment_driver.outputs.batch_id }}
          SEGMENT_DRIVER_CRITICAL_COUNT: ${{ steps.segment_driver.outputs.critical_count }}
          SEGMENT_OUTLOOK_BATCH_ID: ${{ steps.segment_outlook.outputs.batch_id }}
          SEGMENT_OUTLOOK_CRITICAL_COUNT: ${{ steps.segment_outlook.outputs.critical_count }}
        run: |
          batch_id="$SEGMENT_SYNC_BATCH_ID-$SEGMENT_DRIVER_BATCH_ID-$SEGMENT_OUTLOOK_BATCH_ID"
          critical_count=$((SEGMENT_SYNC_CRITICAL_COUNT + SEGMENT_DRIVER_CRITICAL_COUNT + SEGMENT_OUTLOOK_CRITICAL_COUNT))
          title="Segment Update Alert [$batch_id]"
          if [ "$critical_count" != "0" ]; then
            title="🔴 $title"
          else
            title="🟠 $title"
          fi
          existing=$(gh issue list --state all --search "$batch_id in:title" \
            --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/segment-alert.md" \
              --assignee "$GITHUB_REPOSITORY_OWNER"
          else
            echo "Issue #$existing already records batch $batch_id; skipping duplicate."
          fi

      - name: Commit
        if: steps.gate.outputs.changed == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: refresh market and filing data ($(date -u +%Y-%m-%d))"
          git push

  # Separate job with its own checkout, so a failure anywhere in the jobs
  # above (even checkout or runner loss) is reported, and a later success
  # closes the issue again.
  alert:
    needs: [refresh]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Open or close the workflow failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: bash .github/scripts/workflow-alert.sh "$RESULTS"
